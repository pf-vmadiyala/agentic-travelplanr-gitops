apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-planner-worker
  namespace: travel-planner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: travel-planner-worker
  template:
    metadata:
      labels:
        app: travel-planner-worker
    spec:
      serviceAccountName: travel-planner-worker
      containers:
        - name: worker
          image: 138257835519.dkr.ecr.us-east-2.amazonaws.com/travel-planner/app:1cd9cf6
          imagePullPolicy: Always
          command:
            [
              "celery",
              "-A",
              "src.tasks.celery_app",
              "worker",
              "--loglevel=info",
            ]
          envFrom:
            - configMapRef:
                name: travel-planner-config
            - secretRef:
                name: travel-planner-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Asks this specific worker to reply over the broker. A worker that is
          # running but stuck (not consuming from Redis) fails this and is restarted.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - celery -A src.tasks.celery_app inspect ping -d celery@$HOSTNAME --timeout 10
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 20
            failureThreshold: 3
