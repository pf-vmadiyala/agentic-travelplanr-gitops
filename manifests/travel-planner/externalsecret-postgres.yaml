# Database credentials from Secrets Manager (agentic-travel-planner/dev/db-credentials).
# Renders one Secret used by Postgres (POSTGRES_PASSWORD) and the app (DATABASE_URL).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: travel-planner
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: postgres-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        POSTGRES_USER: "{{ .username }}"
        POSTGRES_PASSWORD: "{{ .password }}"
        DATABASE_URL: "postgresql+asyncpg://{{ .username }}:{{ .password }}@postgres.travel-planner.svc.cluster.local:5432/travel_planner"
  data:
    - secretKey: username
      remoteRef:
        key: agentic-travel-planner/dev/db-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: agentic-travel-planner/dev/db-credentials
        property: password