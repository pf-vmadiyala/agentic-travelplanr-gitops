apiVersion: v1
kind: ConfigMap
metadata:
  name: travel-planner-config
  namespace: travel-planner
data:
  # Internal Kubernetes DNS names for in-cluster Postgres and Redis
  DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres.travel-planner.svc.cluster.local:5432/travel_planner"
  REDIS_URL: "redis://redis.travel-planner.svc.cluster.local:6379/0"
  CELERY_BROKER_URL: "redis://redis.travel-planner.svc.cluster.local:6379/1"

  # LLM Provider settings
  LLM_PROVIDER: "xai"
  XAI_MODEL: "grok-4.3"

  # LangSmith Tracing configurations
  LANGCHAIN_TRACING_V2: "true"
  LANGCHAIN_ENDPOINT: "https://api.smith.langchain.com"
  LANGCHAIN_PROJECT: "travel-planner-dev"
