apiVersion: v1
kind: Service
metadata:
  name: travel-planner-api
  namespace: travel-planner
  labels:
    app: travel-planner-api # lets a Prometheus ServiceMonitor select this Service
spec:
  ports:
    - name: http # ServiceMonitors pick endpoints by port name
      port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app: travel-planner-api