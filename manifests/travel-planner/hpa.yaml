apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: travel-planner-api-hpa
  namespace: travel-planner
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: travel-planner-api
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
