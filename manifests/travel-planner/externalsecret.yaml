apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: travel-planner-secrets
  namespace: travel-planner
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: travel-planner-secrets # This K8s Secret will be created dynamically
    creationPolicy: Owner
  data:
    - secretKey: XAI_API_KEY
      remoteRef:
        key: agentic-travel-planner/dev/xai-api-key
    - secretKey: LANGCHAIN_API_KEY
      remoteRef:
        key: agentic-travel-planner/dev/langsmith-api-key
    - secretKey: JWT_SECRET
      remoteRef:
        key: agentic-travel-planner/dev/jwt-secret
    - secretKey: AMADEUS_API_KEY
      remoteRef:
        key: agentic-travel-planner/dev/amadeus-api-key
    - secretKey: AMADEUS_API_SECRET
      remoteRef:
        key: agentic-travel-planner/dev/amadeus-api-secret
    - secretKey: GOOGLE_MAPS_API_KEY
      remoteRef:
        key: agentic-travel-planner/dev/google-maps-api-key
    - secretKey: OPENWEATHERMAP_API_KEY
      remoteRef:
        key: agentic-travel-planner/dev/openweathermap-api-key
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: agentic-travel-planner/dev/openai-api-key
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: agentic-travel-planner/dev/anthropic-api-key
