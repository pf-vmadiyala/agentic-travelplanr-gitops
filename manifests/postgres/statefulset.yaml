apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: travel-planner
spec:
  serviceName: "postgres"
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgis/postgis:15-3.3
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: travel_planner
            - name: POSTGRES_USER
              value: postgres
            # Only used when the data directory is first initialised; after that,
            # the live password is changed with ALTER USER (see H5 runbook).
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            # Keep data in a subdirectory: the EBS volume root contains lost+found,
            # and initdb refuses a non-empty directory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # pg_isready ships in the image: it checks the server accepts connections.
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "travel_planner", "-h", "127.0.0.1"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "travel_planner", "-h", "127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6 # ~2 min of failures before a restart; gives crash recovery time
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
