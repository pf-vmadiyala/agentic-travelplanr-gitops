# Grafana login, from Secrets Manager: agentic-travel-planner/dev/grafana-admin = {"username":"admin","password":"..."}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: agentic-travel-planner/dev/grafana-admin
        property: username
    - secretKey: admin-password
      remoteRef:
        key: agentic-travel-planner/dev/grafana-admin
        property: password
---
# Where Alertmanager sends alerts (used in Phase 2), from Secrets Manager:
# agentic-travel-planner/dev/alertmanager-notifiers = {"slack_webhook_url":"...","healthchecks_url":"..."}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-notifiers
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: alertmanager-notifiers
    creationPolicy: Owner
  data:
    - secretKey: slack-webhook-url
      remoteRef:
        key: agentic-travel-planner/dev/alertmanager-notifiers
        property: slack_webhook_url
    - secretKey: healthchecks-url
      remoteRef:
        key: agentic-travel-planner/dev/alertmanager-notifiers
        property: healthchecks_url