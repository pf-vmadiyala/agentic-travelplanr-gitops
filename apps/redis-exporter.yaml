# Redis exporter: turns Redis statistics into Prometheus metrics.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-exporter                                         # <--
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus-redis-exporter                         # <--
      targetRevision: 6.32.1                                   # <--
      helm:
        releaseName: redis-exporter                            # <--
        valueFiles:
          - $values/platform/monitoring/redis-exporter/values.yaml   # <--
    - repoURL: https://github.com/pf-vmadiyala/agentic-travelplanr-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: travel-planner
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }