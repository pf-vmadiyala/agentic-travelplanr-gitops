# Manifests for monitoring: secrets, scrape targets, probes, dashboards, alert rules.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-config
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/pf-vmadiyala/agentic-travelplanr-gitops.git
    targetRevision: HEAD
    path: platform/monitoring/config
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }