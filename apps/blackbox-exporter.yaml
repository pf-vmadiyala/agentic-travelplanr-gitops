# Blackbox exporter: calls URLs like a user would and reports success and response time.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: blackbox-exporter                                      # <--
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus-blackbox-exporter                      # <--
      targetRevision: 11.19.1                                  # <--
      helm:
        releaseName: blackbox-exporter                         # <--
        valueFiles:
          - $values/platform/monitoring/blackbox/values.yaml   # <--
    - repoURL: https://github.com/pf-vmadiyala/agentic-travelplanr-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring                                      # <-- back to monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }